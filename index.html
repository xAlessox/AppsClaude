<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0c14">
<title>Apps de sonidos</title>
<style>
  :root{
    --bg:#0e0c14;
    --card:#1a1724;
    --line:#2c2838;
    --txt:#f1eef7;
    --dim:#9c96ad;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    padding:max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
  h1{font-size:20px;margin:0 0 6px;text-align:center;font-weight:600}
  a.app{
    display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--txt);
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;
    transition:transform .12s,border-color .18s;
  }
  a.app:active{transform:scale(.97)}
  a.app:focus-visible{outline:2px solid var(--dim);outline-offset:2px}
  .ico{font-size:38px;line-height:1}
  .name{font-size:17px;font-weight:600}
  .desc{font-size:13px;color:var(--dim);margin-top:3px;line-height:1.4}
  .bebe{border-color:#3a4280}
  .terror{border-color:#6b1a20}
</style>
</head>
<body>
<main>
  <h1>Elige una app</h1>
  <a class="app bebe" href="./app-bebe/">
    <span class="ico">🌙</span>
    <span><span class="name">Duerme Bebé</span><br><span class="desc">Ruido blanco y canciones de cuna para dormir al bebé.</span></span>
  </a>
  <a class="app terror" href="./app-terror/">
    <span class="ico">💀</span>
    <span><span class="name">Noche de Terror</span><br><span class="desc">16 sonidos de terror para Halloween y un susto sorpresa.</span></span>
  </a>
</main>
</body>
</html>
